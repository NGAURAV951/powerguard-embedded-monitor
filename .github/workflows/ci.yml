name: PowerGuard checks

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile C demo
        run: gcc -std=c99 -Wall -Wextra -pedantic firmware/power_monitor.c -o power_monitor
      - name: Run C demo
        run: ./power_monitor
      - name: Run Python demo
        run: python powerguard.py --input data/sample_readings.csv
      - name: Check dashboard JavaScript syntax
        run: node --check site/app.js
